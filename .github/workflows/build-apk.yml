name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar vendor (AdvanceMAME, SDL2, tabelas 68000)
        run: android-project/tools/sync-vendor.sh

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Instalar NDK e CMake do projeto
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Compilar APK (arm64-v8a + armeabi-v7a)
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Advmenu-Plus-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
