name: HBMAME port (CI)

# Iteracao da Fase 5 (build verde) do port nativo HBMAME: roda manualmente
# (aba Actions > Run workflow). Compila os alvos hbmcore/hbmemu/hbmosd/
# hbmfrontend e — com HBM_APK_GLUE=ON — o libmain.so do APK avulso HBMAME
# Android, com o clang do NDK; sobe o log de erros como artefato para
# corrigir por lotes.
on:
  workflow_dispatch:

jobs:
  hbmport:
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vendor do HBMAME 0.289.6 (fixado)
        run: bash android-project/tools/sync-hbmame.sh

      - name: Vendor do SDL2 (mesmo do APK)
        run: bash android-project/tools/sync-vendor.sh

      - name: Instalar NDK e CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.3.11579264" "cmake;3.22.1" >/dev/null
          echo "NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Configurar CMake (${{ matrix.abi }}) com glue do APK
        run: |
          cmake -G Ninja -B build/${{ matrix.abi }} -S android-project/hbm-port \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release -DHBM_APK_GLUE=ON -DHBM_LIBRETRO=ON

      - name: Compilar libs do port + libmain.so do APK HBMAME
        run: |
          set +e
          cmake --build build/${{ matrix.abi }} --target hbmcore hbmemu hbmosd hbmfrontend main hbmame_libretro -j 2 \
            > build-${{ matrix.abi }}.log 2>&1
          rc=$?
          tail -n 400 build-${{ matrix.abi }}.log
          exit $rc

      - name: Subir log de build como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hbm-port-log-${{ matrix.abi }}
          path: build-${{ matrix.abi }}.log
          if-no-files-found: error

      - name: Subir libmain.so do APK HBMAME como artefato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hbmame-libmain-${{ matrix.abi }}
          path: build/${{ matrix.abi }}/libmain.so
          if-no-files-found: error

  hbm-apk:
    runs-on: ubuntu-latest
    needs: hbmport
    steps:
      - uses: actions/checkout@v4

      - name: Vendor do HBMAME 0.289.6 (fixado)
        run: bash android-project/tools/sync-hbmame.sh

      - name: Vendor do SDL2 (mesmo do APK 0.106)
        run: bash android-project/tools/sync-vendor.sh

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Instalar NDK e CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Compilar APK HBMAME Android
        run: gradle --no-daemon -p android-project-hbm assembleDebug

      - name: Publicar APK HBMAME como artefato
        uses: actions/upload-artifact@v4
        with:
          name: HBMAME-Android-apk
          path: android-project-hbm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
